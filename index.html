<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Central Denúncia Wa</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Orbitron',sans-serif;
    background:#040404;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* FUNDO */

body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle at center, rgba(255,0,0,0.25), transparent 30%),
    repeating-linear-gradient(
        90deg,
        rgba(255,0,0,0.04) 0px,
        rgba(255,0,0,0.04) 2px,
        transparent 2px,
        transparent 100px
    );
    animation:bgMove 15s linear infinite;
}

@keyframes bgMove{
    0%{
        transform:translate(0,0);
    }
    100%{
        transform:translate(-250px,-250px);
    }
}

/* RAIOS */

.lightning{
    position:absolute;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
}

.lightning span{
    position:absolute;
    width:2px;
    height:300px;
    background:linear-gradient(transparent, red, white, red, transparent);
    box-shadow:
    0 0 20px red,
    0 0 40px red,
    0 0 80px red;
    opacity:0;
    animation:lightning 4s linear infinite;
}

.lightning span:nth-child(1){
    left:15%;
    top:-20%;
    transform:rotate(25deg);
    animation-delay:0s;
}

.lightning span:nth-child(2){
    left:70%;
    top:-20%;
    transform:rotate(-20deg);
    animation-delay:2s;
}

.lightning span:nth-child(3){
    left:45%;
    top:-30%;
    transform:rotate(15deg);
    animation-delay:1s;
}

@keyframes lightning{
    0%{
        opacity:0;
    }

    5%{
        opacity:1;
    }

    8%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}

/* PARTÍCULAS */

.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.particles span{
    position:absolute;
    width:5px;
    height:5px;
    background:red;
    border-radius:50%;
    box-shadow:
    0 0 10px red,
    0 0 20px red,
    0 0 40px red;
    animation:float 10s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-10vh) scale(1);
        opacity:0;
    }
}

/* CARD */

.container{
    position:relative;
    z-index:5;
    width:420px;
    padding:35px;
    border-radius:30px;
    background:rgba(0,0,0,0.75);
    border:1px solid rgba(255,0,0,0.4);
    backdrop-filter:blur(15px);
    box-shadow:
    0 0 20px red,
    0 0 60px rgba(255,0,0,0.7),
    inset 0 0 30px rgba(255,0,0,0.25);
    animation:pulse 3s infinite alternate;
}

@keyframes pulse{

    from{
        box-shadow:
        0 0 20px red,
        0 0 60px rgba(255,0,0,0.7),
        inset 0 0 30px rgba(255,0,0,0.25);
    }

    to{
        box-shadow:
        0 0 35px red,
        0 0 100px rgba(255,0,0,1),
        inset 0 0 40px rgba(255,0,0,0.35);
    }
}

/* TITULO */

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    color:white;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    text-shadow:
    0 0 10px red,
    0 0 30px red,
    0 0 70px red;
}

.logo p{
    color:#999;
    margin-top:10px;
    font-size:13px;
}

/* INPUTS */

.inputBox{
    margin-top:20px;
}

.inputBox label{
    color:#ff2d2d;
    font-size:13px;
    display:block;
    margin-bottom:10px;
    letter-spacing:2px;
}

.inputBox input,
.inputBox select{
    width:100%;
    padding:18px;
    border-radius:18px;
    border:1px solid rgba(255,0,0,0.4);
    background:#080808;
    color:white;
    outline:none;
    transition:0.3s;
    font-family:'Orbitron',sans-serif;
    font-size:14px;
}

.inputBox input:focus,
.inputBox select:focus{
    border-color:red;
    box-shadow:
    0 0 15px red,
    0 0 40px rgba(255,0,0,0.8);
}

/* BOTÃO */

button{
    width:100%;
    padding:18px;
    margin-top:30px;
    border:none;
    border-radius:20px;
    background:linear-gradient(90deg,#5e0000,#ff0000,#5e0000);
    background-size:300% 300%;
    color:white;
    font-size:18px;
    font-weight:700;
    letter-spacing:4px;
    cursor:pointer;
    transition:0.3s;
    animation:btnAnim 5s infinite;
    box-shadow:
    0 0 20px red,
    0 0 60px rgba(255,0,0,0.8);
}

@keyframes btnAnim{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

button:hover{
    transform:scale(1.03);
    box-shadow:
    0 0 40px red,
    0 0 90px red;
}

/* LOGIN */

#loginPage{
    display:block;
}

#painelPage{
    display:none;
}

/* LOADING */

.loading{
    margin-top:25px;
    display:none;
}

.loadingText{
    color:#ff3d3d;
    margin-bottom:10px;
    text-align:center;
    font-size:13px;
}

.bar{
    width:100%;
    height:16px;
    background:#111;
    border-radius:30px;
    overflow:hidden;
    border:1px solid rgba(255,0,0,0.4);
}

.progress{
    width:0%;
    height:100%;
    border-radius:30px;
    background:linear-gradient(90deg,#ff0000,#ff4d4d,#ff0000);
    box-shadow:
    0 0 20px red,
    0 0 40px red;
    animation:load 3s linear forwards;
}

@keyframes load{
    from{
        width:0%;
    }

    to{
        width:100%;
    }
}

/* POPUP */

.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:#0d0d0d;
    border:1px solid red;
    padding:25px 40px;
    border-radius:20px;
    color:white;
    z-index:10;
    box-shadow:
    0 0 20px red,
    0 0 60px red;
    transition:0.4s;
}

.popup.active{
    transform:translate(-50%,-50%) scale(1);
}

/* ERRO */

.erro{
    color:#ff4d4d;
    text-align:center;
    margin-top:15px;
    font-size:12px;
}

/* RESPONSIVO */

@media(max-width:500px){

    .container{
        width:92%;
        padding:25px;
    }

    .logo h1{
        font-size:34px;
    }

}

</style>
</head>
<body>

<div class="lightning">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="particles">
    <span style="left:10%; animation-duration:8s;"></span>
    <span style="left:20%; animation-duration:12s;"></span>
    <span style="left:35%; animation-duration:7s;"></span>
    <span style="left:50%; animation-duration:10s;"></span>
    <span style="left:65%; animation-duration:14s;"></span>
    <span style="left:80%; animation-duration:9s;"></span>
    <span style="left:90%; animation-duration:11s;"></span>
</div>

<!-- LOGIN -->

<div class="container" id="loginPage">

    <div class="logo">
        <h1>LOGIN</h1>
        <p>Central Privada</p>
    </div>

    <div class="inputBox">
        <label>USUÁRIO</label>
        <input type="text" id="usuario" placeholder="Digite seu usuário">
    </div>

    <div class="inputBox">
        <label>SENHA</label>
        <input type="password" id="senha" placeholder="Digite sua senha">
    </div>

    <button onclick="logar()">
        ACESSAR
    </button>

    <div class="erro" id="erro"></div>

</div>

<!-- PAINEL -->

<div class="container" id="painelPage">

    <div class="logo">
        <h1>Central Denúncia Wa</h1>
        <p>Ban em até 24 horas</p>
    </div>

    <div class="inputBox">
        <label>NÚMERO</label>
        <input type="text" placeholder="+55 99 99999-9999">
    </div>

    <div class="inputBox">
        <label>QUANTIDADE</label>

        <select>
            <option>Selecione</option>
            <option>1000</option>
            <option>2000</option>
            <option>3000</option>
            <option>4000</option>
            <option>5000</option>
            <option>6000</option>
            <option>7000</option>
            <option>8000</option>
            <option>9000</option>
            <option>10000</option>
        </select>
    </div>

    <button onclick="enviar()">
        ENVIAR
    </button>

    <div class="loading" id="loading">

        <div class="loadingText">
            PROCESSANDO...
        </div>

        <div class="bar">
            <div class="progress"></div>
        </div>

    </div>

</div>

<div class="popup" id="popup">
    ✔ AÇÃO CONCLUÍDA
</div>

<script>

function logar(){

    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;

    if(usuario === "bjk250" && senha === "bjk250"){

        document.getElementById("loginPage").style.display = "none";
        document.getElementById("painelPage").style.display = "block";

    }else{

        document.getElementById("erro").innerHTML =
        "USUÁRIO OU SENHA INCORRETOS";

    }
}

function enviar(){

    let loading = document.getElementById("loading");
    let popup = document.getElementById("popup");

    loading.style.display = "block";

    setTimeout(() => {

        loading.style.display = "none";

        popup.classList.add("active");

        setTimeout(() => {
            popup.classList.remove("active");
        },3000);

    },3000);
}

</script>

</body>
</html>
